# ~/.config/mise/config.toml
# Mise runtime version manager configuration
# Managed as a chezmoi dotfile — edit via: chezmoi edit ~/.config/mise/config.toml
#
# This file defines programming language runtimes.
# Packages installed via each runtime (npm, pip, cargo, bun) are defined in:
#   packages/npm-packages.txt
#   packages/pip-packages.txt
#   packages/cargo-packages.txt
#   packages/bun-packages.txt
#
# Note: .tool-versions is also kept in $HOME for asdf coworker compatibility.

[tools]
node      = "24.13.0"
pnpm      = "latest"
python    = "3.12.9"
rust      = "1.95.0"
uv        = "0.9.28"
go        = "1.23.6"
bun       = "1.3.7"
just      = "1.46.0"
terraform = "1.13.5"

[settings]
# Automatically install tools when entering a directory with .tool-versions or mise.toml
auto_install = true
